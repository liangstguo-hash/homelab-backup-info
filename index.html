<main><h1>HomeLab Backup</h1>
<p>用于账户所有者个人电脑的加密备份工具。它在本机采集选定的文件、应用配置和数据库备份，通过 Restic 加密后，使用 rclone 保存到所有者自己的 Google Drive。</p>
<p>本工具为个人使用，不提供公众注册或托管备份服务。Google 授权由账户所有者在本机浏览器完成。</p>
<p>Google Drive 权限限于本应用创建或由用户明确授权给本应用的文件。备份程序通过该权限上传、读取和恢复加密备份。历史备份删除由所有者配置保留策略后执行。</p>
<p><a href="privacy.html">隐私说明 / Privacy policy</a></p>
<small>支持联系：使用 Google 授权页面中显示的应用支持邮箱。</small></main></html>
